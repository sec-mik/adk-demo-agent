# Runs the shared agent security scan from mik-sec/agent-security-guardrails
# on every pull request.
name: Agent Security

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  agent-security:
    uses: mik-sec/agent-security-guardrails/.github/workflows/agent-security-scan.yml@main
    with:
      enforce: false # true fails the check on CRITICAL/HIGH findings
